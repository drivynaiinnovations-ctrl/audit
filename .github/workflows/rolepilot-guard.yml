name: RolePilot Submission Guard tests
on:
  push:
    paths:
      - 'rolepilot-submission-guard/**'
      - '.github/workflows/rolepilot-guard.yml'
  pull_request:
    paths:
      - 'rolepilot-submission-guard/**'
      - '.github/workflows/rolepilot-guard.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run submission guard regression suite
        run: cd rolepilot-submission-guard && python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Cloudflare Worker handler tests
        run: cd rolepilot-submission-guard/cloudflare && npm test
